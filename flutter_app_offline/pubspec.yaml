name: yoga_app
description: A yoga pose analysis application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  file_picker: ^8.0.0
  video_player: ^2.8.0
  tflite_flutter: ^0.11.0
  image: ^4.0.17
  path_provider: ^2.1.0
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yoga_model_with_flex.tflite
